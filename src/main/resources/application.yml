spring:
  application:
    name: oficina-mecanica-dgcar

  datasource:
    url: jdbc:postgresql://localhost:5432/oficina
    username: oficina
    password: oficina123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:minha-chave-secreta-temporaria-trocar-em-producao}
  expiration: 86400000

oficina:
  pagamento:
    gateway:
      # Taxa de aprovação simulada (0.0 = sempre recusa, 1.0 = sempre aprova)
      approval-rate: ${PAGAMENTO_GATEWAY_APPROVAL_RATE:0.9}
      # Latência simulada em ms
      latency-ms: ${PAGAMENTO_GATEWAY_LATENCY_MS:100}

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:oficina
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:oficina-test
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false
