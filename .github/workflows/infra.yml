name: Infra CI/CD - Terraform AWS

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PROJECT_NAME: oficina-dgcar-16soat
  ENVIRONMENT: development
  TF_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'apply' }}
  K8S_NAMESPACE: oficina
  K8S_DEPLOYMENT: oficina-api

jobs:
  terraform:
    name: Terraform ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'apply' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap Terraform backend bucket
        if: env.TF_ACTION == 'apply'
        shell: bash
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          echo "Current AWS principal: $(aws sts get-caller-identity --query Arn --output text)"

          if aws s3api head-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Terraform backend bucket already exists: $TF_STATE_BUCKET"
          else
            echo "Terraform backend bucket not found. Creating governed S3 backend with Terraform."

            cat > infra/backend-bootstrap/terraform.tfvars <<EOF
          aws_region        = "$AWS_REGION"
          project_name      = "${{ env.PROJECT_NAME }}"
          environment       = "${{ env.ENVIRONMENT }}"
          state_bucket_name = "$TF_STATE_BUCKET"
          EOF

            terraform -chdir=infra/backend-bootstrap init
            terraform -chdir=infra/backend-bootstrap validate
            terraform -chdir=infra/backend-bootstrap apply -auto-approve
          fi

          echo "Enforcing backend bucket governance settings."

          aws s3api put-bucket-versioning \
            --bucket "$TF_STATE_BUCKET" \
            --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption \
            --bucket "$TF_STATE_BUCKET" \
            --server-side-encryption-configuration '{
              "Rules": [
                {
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }
              ]
            }'

          aws s3api put-public-access-block \
            --bucket "$TF_STATE_BUCKET" \
            --public-access-block-configuration '{
              "BlockPublicAcls": true,
              "IgnorePublicAcls": true,
              "BlockPublicPolicy": true,
              "RestrictPublicBuckets": true
            }'

          aws s3api put-bucket-ownership-controls \
            --bucket "$TF_STATE_BUCKET" \
            --ownership-controls '{
              "Rules": [
                {
                  "ObjectOwnership": "BucketOwnerEnforced"
                }
              ]
            }'

      - name: Create backend file for Terraform
        working-directory: infra
        run: |
          cat > backend.tf <<EOF
          terraform {
            backend "s3" {
              bucket       = "${{ secrets.TF_STATE_BUCKET }}"
              key          = "${{ secrets.TF_STATE_KEY }}"
              region       = "${{ env.AWS_REGION }}"
              encrypt      = true
              use_lockfile = true
            }
          }
          EOF

      - name: Create terraform.tfvars for pipeline execution
        working-directory: infra
        run: |
          cat > terraform.tfvars <<EOF
          aws_region  = "${{ env.AWS_REGION }}"
          project_name = "${{ env.PROJECT_NAME }}"
          environment  = "${{ env.ENVIRONMENT }}"

          eks_cluster_version = null

          node_instance_types = ["t3.small"]
          node_desired_size   = 1
          node_min_size       = 1
          node_max_size       = 2
          node_disk_size      = 20

          db_name                  = "oficina"
          db_username              = "${{ secrets.DB_USERNAME }}"
          db_password              = "${{ secrets.DB_PASSWORD }}"
          db_instance_class        = "db.t4g.micro"
          db_allocated_storage     = 20
          db_max_allocated_storage = 30

          enable_github_actions_eks_access = true
          github_actions_iam_user_name     = "github-actions-oficina-dgcar"
          EOF

      - name: Terraform init
        working-directory: infra
        run: terraform init -reconfigure

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Terraform plan
        if: env.TF_ACTION == 'apply'
        working-directory: infra
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: env.TF_ACTION == 'apply'
        working-directory: infra
        run: terraform apply -auto-approve tfplan

      - name: Print Terraform outputs
        if: env.TF_ACTION == 'apply'
        working-directory: infra
        run: terraform output

      - name: Read Terraform outputs before destroy
        if: env.TF_ACTION == 'destroy'
        id: destroy-outputs
        working-directory: infra
        continue-on-error: true
        run: |
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "vpc_id=$(terraform output -raw vpc_id)" >> "$GITHUB_OUTPUT"

      - name: Delete Kubernetes resources before destroy
        if: env.TF_ACTION == 'destroy' && steps.destroy-outputs.outputs.eks_cluster_name != ''
        continue-on-error: true
        env:
          EKS_CLUSTER_NAME: ${{ steps.destroy-outputs.outputs.eks_cluster_name }}
          VPC_ID: ${{ steps.destroy-outputs.outputs.vpc_id }}
        run: |
          set -u

          if aws eks describe-cluster --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" >/dev/null 2>&1; then
            aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

            kubectl delete service oficina-api -n "$K8S_NAMESPACE" --ignore-not-found=true
            kubectl delete namespace "$K8S_NAMESPACE" --ignore-not-found=true

            for attempt in $(seq 1 30); do
              if ! kubectl get namespace "$K8S_NAMESPACE" >/dev/null 2>&1; then
                echo "Kubernetes namespace removed."
                break
              fi

              echo "Waiting for Kubernetes namespace removal... attempt $attempt/30"
              sleep 10
            done
          else
            echo "EKS cluster is not available. Skipping Kubernetes API cleanup and checking AWS load balancer dependencies by VPC."
          fi

          classic_load_balancers() {
            aws elb describe-load-balancers --region "$AWS_REGION" --output json \
              | python3 -c 'import json, os, sys; vpc_id = os.environ.get("VPC_ID"); print("\n".join(lb.get("LoadBalancerName") for lb in json.load(sys.stdin).get("LoadBalancerDescriptions", []) if lb.get("VPCId") == vpc_id))'
          }

          elbv2_load_balancers() {
            aws elbv2 describe-load-balancers --region "$AWS_REGION" --output json \
              | python3 -c 'import json, os, sys; vpc_id = os.environ.get("VPC_ID"); print("\n".join(lb.get("LoadBalancerArn") for lb in json.load(sys.stdin).get("LoadBalancers", []) if lb.get("VpcId") == vpc_id))'
          }

          elb_network_interface_count() {
            aws ec2 describe-network-interfaces \
              --region "$AWS_REGION" \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --output json \
              | python3 -c 'import json, sys; interfaces = json.load(sys.stdin).get("NetworkInterfaces", []); print(sum(1 for eni in interfaces if eni.get("RequesterId") == "amazon-elb" or eni.get("Description", "").startswith("ELB ")))'
          }

          k8s_elb_security_groups() {
            aws ec2 describe-security-groups \
              --region "$AWS_REGION" \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --output json \
              | python3 -c 'import json, sys; print("\n".join(sg.get("GroupId") for sg in json.load(sys.stdin).get("SecurityGroups", []) if sg.get("GroupName", "").startswith("k8s-elb-")))'
          }

          for lb_name in $(classic_load_balancers); do
            echo "Deleting Classic Load Balancer: $lb_name"
            aws elb delete-load-balancer --region "$AWS_REGION" --load-balancer-name "$lb_name"
          done

          for lb_arn in $(elbv2_load_balancers); do
            echo "Deleting ELBv2 Load Balancer: $lb_arn"
            aws elbv2 delete-load-balancer --region "$AWS_REGION" --load-balancer-arn "$lb_arn"
          done

          for attempt in $(seq 1 40); do
            CLASSIC_LBS="$(classic_load_balancers)"
            ELBV2_LBS="$(elbv2_load_balancers)"
            ELB_ENI_COUNT="$(elb_network_interface_count)"

            if [ -z "$CLASSIC_LBS" ] && [ -z "$ELBV2_LBS" ] && [ "$ELB_ENI_COUNT" = "0" ]; then
              echo "Kubernetes Load Balancer dependencies removed."
              break
            fi

            echo "Waiting for Load Balancer cleanup... attempt $attempt/40"
            echo "Classic LBs: ${CLASSIC_LBS:-none}"
            echo "ELBv2 LBs: ${ELBV2_LBS:-none}"
            echo "ELB ENIs: $ELB_ENI_COUNT"
            sleep 15
          done

          for sg_id in $(k8s_elb_security_groups); do
            echo "Deleting orphan Kubernetes ELB security group: $sg_id"
            aws ec2 delete-security-group --region "$AWS_REGION" --group-id "$sg_id" || true
          done

      - name: Terraform destroy
        if: env.TF_ACTION == 'destroy'
        working-directory: infra
        run: terraform destroy -auto-approve
