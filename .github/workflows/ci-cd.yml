name: CI/CD Unified - Infra + Aplicacao + Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PROJECT_NAME: oficina-dgcar-16soat
  ENVIRONMENT: development
  K8S_NAMESPACE: oficina
  K8S_DEPLOYMENT: oficina-api
  K8S_CONTAINER: oficina-api

jobs:
  infra:
    name: Provision infrastructure with Terraform
    runs-on: ubuntu-latest
    outputs:
      ecr_repository_url: ${{ steps.terraform-outputs.outputs.ecr_repository_url }}
      eks_cluster_name: ${{ steps.terraform-outputs.outputs.eks_cluster_name }}
      spring_datasource_url: ${{ steps.terraform-outputs.outputs.spring_datasource_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Terraform backend bucket exists
        shell: bash
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          echo "Current AWS principal: $(aws sts get-caller-identity --query Arn --output text)"

          if aws s3api head-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Terraform backend bucket already exists: $TF_STATE_BUCKET"
          else
            echo "Terraform backend bucket not found. Creating bucket: $TF_STATE_BUCKET"
            if aws s3 mb "s3://$TF_STATE_BUCKET" --region "$AWS_REGION"; then
              echo "Bucket created successfully."
            else
              echo "Bucket creation failed because the current AWS principal does not have s3:CreateBucket permission."
              echo "Create the S3 bucket once with an AWS admin/root principal or run the bootstrap Terraform under privileged credentials."
              echo "Then rerun the workflow with the same TF_STATE_BUCKET secret."
              exit 1
            fi
          fi

      - name: Create backend file for Terraform
        working-directory: infra
        run: |
          cat > backend.tf <<EOF
          terraform {
            backend "s3" {
              bucket       = "${{ secrets.TF_STATE_BUCKET }}"
              key          = "${{ secrets.TF_STATE_KEY }}"
              region       = "${{ env.AWS_REGION }}"
              encrypt      = true
              use_lockfile = true
            }
          }
          EOF

      - name: Create terraform.tfvars for pipeline execution
        working-directory: infra
        run: |
          cat > terraform.tfvars <<EOF
          aws_region  = "${{ env.AWS_REGION }}"
          project_name = "${{ env.PROJECT_NAME }}"
          environment  = "${{ env.ENVIRONMENT }}"

          eks_cluster_version = null

          node_instance_types = ["t3.small"]
          node_desired_size   = 1
          node_min_size       = 1
          node_max_size       = 2
          node_disk_size      = 20

          db_name                  = "oficina"
          db_username              = "${{ secrets.DB_USERNAME }}"
          db_password              = "${{ secrets.DB_PASSWORD }}"
          db_instance_class        = "db.t4g.micro"
          db_allocated_storage     = 20
          db_max_allocated_storage = 30

          enable_github_actions_eks_access = true
          github_actions_iam_user_name     = "github-actions-oficina-dgcar"
          EOF

      - name: Terraform init
        working-directory: infra
        run: terraform init -reconfigure

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -out=tfplan

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan

      - name: Export Terraform outputs
        id: terraform-outputs
        working-directory: infra
        run: |
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "spring_datasource_url=$(terraform output -raw spring_datasource_url)" >> "$GITHUB_OUTPUT"

  build-test:
    name: Build and test application
    runs-on: ubuntu-latest
    needs: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run automated tests
        run: mvn clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/site/jacoco
          if-no-files-found: ignore

  deploy:
    name: Build image, push to ECR and deploy on EKS
    runs-on: ubuntu-latest
    needs:
      - infra
      - build-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          IMAGE_URI: ${{ needs.infra.outputs.ecr_repository_url }}:${{ github.sha }}
        run: docker build -t "$IMAGE_URI" .

      - name: Push Docker image
        env:
          IMAGE_URI: ${{ needs.infra.outputs.ecr_repository_url }}:${{ github.sha }}
        run: docker push "$IMAGE_URI"

      - name: Update kubeconfig
        env:
          EKS_CLUSTER_NAME: ${{ needs.infra.outputs.eks_cluster_name }}
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Create or update Kubernetes namespace
        run: kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update Kubernetes secret
        env:
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          SPRING_DATASOURCE_USERNAME="${SPRING_DATASOURCE_USERNAME:-$DB_USERNAME}"
          SPRING_DATASOURCE_PASSWORD="${SPRING_DATASOURCE_PASSWORD:-$DB_PASSWORD}"

          kubectl create secret generic oficina-api-secret -n "$K8S_NAMESPACE" \
            --from-literal=SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=SMTP_USERNAME="$SMTP_USERNAME" \
            --from-literal=SMTP_PASSWORD="$SMTP_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Prepare Kubernetes manifests from Terraform outputs
        env:
          IMAGE_URI: ${{ needs.infra.outputs.ecr_repository_url }}:${{ github.sha }}
          SPRING_DATASOURCE_URL: ${{ needs.infra.outputs.spring_datasource_url }}
        run: |
          IMAGE_REPOSITORY="${IMAGE_URI%:*}"
          IMAGE_TAG="${IMAGE_URI##*:}"

          sed -i "s|  SPRING_DATASOURCE_URL: .*|  SPRING_DATASOURCE_URL: \"$SPRING_DATASOURCE_URL\"|g" k8s/configmap.yaml
          sed -i "s|  OFICINA_PUBLIC_BASE_URL: .*|  OFICINA_PUBLIC_BASE_URL: \"http://localhost:8080\"|g" k8s/configmap.yaml
          sed -i "s|    newName: .*|    newName: $IMAGE_REPOSITORY|g" k8s/kustomization.yaml
          sed -i "s|    newTag: .*|    newTag: $IMAGE_TAG|g" k8s/kustomization.yaml

      - name: Apply Kubernetes manifests
        run: kubectl apply -k k8s

      - name: Update deployment image
        env:
          IMAGE_URI: ${{ needs.infra.outputs.ecr_repository_url }}:${{ github.sha }}
        run: kubectl set image deployment/"$K8S_DEPLOYMENT" "$K8S_CONTAINER"="$IMAGE_URI" -n "$K8S_NAMESPACE"

      - name: Wait for rollout
        run: kubectl rollout status deployment/"$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout=180s

      - name: Update public base URL from LoadBalancer
        run: |
          LOAD_BALANCER_HOSTNAME=""

          for attempt in $(seq 1 30); do
            LOAD_BALANCER_HOSTNAME="$(kubectl get svc oficina-api -n "$K8S_NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"

            if [ -n "$LOAD_BALANCER_HOSTNAME" ]; then
              break
            fi

            echo "Waiting for LoadBalancer hostname... attempt $attempt/30"
            sleep 10
          done

          if [ -n "$LOAD_BALANCER_HOSTNAME" ]; then
            kubectl patch configmap oficina-api-config -n "$K8S_NAMESPACE" \
              --type merge \
              -p "{\"data\":{\"OFICINA_PUBLIC_BASE_URL\":\"http://$LOAD_BALANCER_HOSTNAME\"}}"
            kubectl rollout restart deployment/"$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE"
            kubectl rollout status deployment/"$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout=180s
          else
            echo "LoadBalancer hostname is not available yet. Keeping temporary OFICINA_PUBLIC_BASE_URL."
          fi

      - name: Print deployment URL
        run: |
          kubectl get svc oficina-api -n "$K8S_NAMESPACE"
          echo "Swagger: http://$(kubectl get svc oficina-api -n "$K8S_NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')/swagger-ui.html"
