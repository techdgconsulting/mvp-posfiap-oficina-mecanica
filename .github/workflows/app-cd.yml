name: App CI/CD - Build, Test and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "k8s/**"
      - "Dockerfile"
      - "pom.xml"
      - ".github/workflows/app-cd.yml"

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  K8S_NAMESPACE: oficina
  K8S_DEPLOYMENT: oficina-api
  K8S_CONTAINER: oficina-api

jobs:
  build-test:
    name: Build and test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run automated tests
        run: mvn clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/site/jacoco
          if-no-files-found: ignore

  deploy:
    name: Build image, push to ECR and deploy on EKS
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create backend file for Terraform outputs
        working-directory: infra
        run: |
          cat > backend.tf <<EOF
          terraform {
            backend "s3" {
              bucket       = "${{ secrets.TF_STATE_BUCKET }}"
              key          = "${{ secrets.TF_STATE_KEY }}"
              region       = "${{ env.AWS_REGION }}"
              encrypt      = true
              use_lockfile = true
            }
          }
          EOF

      - name: Read Terraform outputs
        id: terraform-outputs
        working-directory: infra
        run: |
          terraform init -reconfigure

          ECR_REPOSITORY_URL="$(terraform output -raw ecr_repository_url)"
          EKS_CLUSTER_NAME="$(terraform output -raw eks_cluster_name)"
          SPRING_DATASOURCE_URL="$(terraform output -raw spring_datasource_url)"

          if [ -z "$ECR_REPOSITORY_URL" ]; then
            echo "::error::Terraform output ecr_repository_url is empty. Run the infra workflow first and check the remote state configuration."
            exit 1
          fi

          if [ -z "$EKS_CLUSTER_NAME" ]; then
            echo "::error::Terraform output eks_cluster_name is empty. Run the infra workflow first and check the remote state configuration."
            exit 1
          fi

          if [ -z "$SPRING_DATASOURCE_URL" ]; then
            echo "::error::Terraform output spring_datasource_url is empty. Run the infra workflow first and check the remote state configuration."
            exit 1
          fi

          if [[ ! "$ECR_REPOSITORY_URL" =~ ^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/.+ ]]; then
            echo "::error::Terraform output ecr_repository_url is not a valid ECR repository URL: $ECR_REPOSITORY_URL"
            exit 1
          fi

          echo "Using ECR repository: $ECR_REPOSITORY_URL"
          echo "Using EKS cluster: $EKS_CLUSTER_NAME"

          echo "ecr_repository_url=$ECR_REPOSITORY_URL" >> "$GITHUB_OUTPUT"
          echo "eks_cluster_name=$EKS_CLUSTER_NAME" >> "$GITHUB_OUTPUT"
          echo "spring_datasource_url=$SPRING_DATASOURCE_URL" >> "$GITHUB_OUTPUT"

      - name: Validate Docker image URI
        env:
          IMAGE_URI: ${{ steps.terraform-outputs.outputs.ecr_repository_url }}:${{ github.sha }}
        run: |
          if [[ ! "$IMAGE_URI" =~ ^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/.+:[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid Docker image URI generated from Terraform outputs: $IMAGE_URI"
            exit 1
          fi

          echo "Docker image URI is valid: $IMAGE_URI"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          IMAGE_URI: ${{ steps.terraform-outputs.outputs.ecr_repository_url }}:${{ github.sha }}
        run: docker build -t "$IMAGE_URI" .

      - name: Push Docker image
        env:
          IMAGE_URI: ${{ steps.terraform-outputs.outputs.ecr_repository_url }}:${{ github.sha }}
        run: docker push "$IMAGE_URI"

      - name: Update kubeconfig
        env:
          EKS_CLUSTER_NAME: ${{ steps.terraform-outputs.outputs.eks_cluster_name }}
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Create or update Kubernetes namespace
        run: kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update Kubernetes secret
        env:
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          SPRING_DATASOURCE_USERNAME="${SPRING_DATASOURCE_USERNAME:-$DB_USERNAME}"
          SPRING_DATASOURCE_PASSWORD="${SPRING_DATASOURCE_PASSWORD:-$DB_PASSWORD}"

          if [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "::error::SMTP_USERNAME and SMTP_PASSWORD secrets are required for the application CD deploy."
            exit 1
          fi

          kubectl create secret generic oficina-api-secret -n "$K8S_NAMESPACE" \
            --from-literal=SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=SMTP_USERNAME="$SMTP_USERNAME" \
            --from-literal=SMTP_PASSWORD="$SMTP_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Prepare Kubernetes manifests from Terraform outputs
        env:
          IMAGE_URI: ${{ steps.terraform-outputs.outputs.ecr_repository_url }}:${{ github.sha }}
          SPRING_DATASOURCE_URL: ${{ steps.terraform-outputs.outputs.spring_datasource_url }}
          OFICINA_EMAIL_ENABLED: ${{ vars.OFICINA_EMAIL_ENABLED || secrets.OFICINA_EMAIL_ENABLED || 'true' }}
          OFICINA_EMAIL_MODE: ${{ vars.OFICINA_EMAIL_MODE || secrets.OFICINA_EMAIL_MODE || 'SMTP' }}
          OFICINA_EMAIL_REMETENTE: ${{ vars.OFICINA_EMAIL_REMETENTE || secrets.OFICINA_EMAIL_REMETENTE || 'no-reply@dgcar.local' }}
          SMTP_HOST: ${{ vars.SMTP_HOST || secrets.SMTP_HOST || 'sandbox.smtp.mailtrap.io' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || secrets.SMTP_PORT || '587' }}
          SMTP_AUTH: ${{ vars.SMTP_AUTH || secrets.SMTP_AUTH || 'true' }}
          SMTP_STARTTLS_ENABLE: ${{ vars.SMTP_STARTTLS_ENABLE || secrets.SMTP_STARTTLS_ENABLE || 'true' }}
          MANAGEMENT_HEALTH_MAIL_ENABLED: ${{ vars.MANAGEMENT_HEALTH_MAIL_ENABLED || secrets.MANAGEMENT_HEALTH_MAIL_ENABLED || 'false' }}
        run: |
          IMAGE_REPOSITORY="${IMAGE_URI%:*}"
          IMAGE_TAG="${IMAGE_URI##*:}"

          sed -i "s|  SPRING_DATASOURCE_URL: .*|  SPRING_DATASOURCE_URL: \"$SPRING_DATASOURCE_URL\"|g" k8s/configmap.yaml
          sed -i "s|  OFICINA_PUBLIC_BASE_URL: .*|  OFICINA_PUBLIC_BASE_URL: \"http://localhost:8080\"|g" k8s/configmap.yaml
          sed -i "s|  OFICINA_EMAIL_ENABLED: .*|  OFICINA_EMAIL_ENABLED: \"$OFICINA_EMAIL_ENABLED\"|g" k8s/configmap.yaml
          sed -i "s|  OFICINA_EMAIL_MODE: .*|  OFICINA_EMAIL_MODE: \"$OFICINA_EMAIL_MODE\"|g" k8s/configmap.yaml
          sed -i "s|  OFICINA_EMAIL_REMETENTE: .*|  OFICINA_EMAIL_REMETENTE: \"$OFICINA_EMAIL_REMETENTE\"|g" k8s/configmap.yaml
          sed -i "s|  SMTP_HOST: .*|  SMTP_HOST: \"$SMTP_HOST\"|g" k8s/configmap.yaml
          sed -i "s|  SMTP_PORT: .*|  SMTP_PORT: \"$SMTP_PORT\"|g" k8s/configmap.yaml
          sed -i "s|  SMTP_AUTH: .*|  SMTP_AUTH: \"$SMTP_AUTH\"|g" k8s/configmap.yaml
          sed -i "s|  SMTP_STARTTLS_ENABLE: .*|  SMTP_STARTTLS_ENABLE: \"$SMTP_STARTTLS_ENABLE\"|g" k8s/configmap.yaml
          sed -i "s|  MANAGEMENT_HEALTH_MAIL_ENABLED: .*|  MANAGEMENT_HEALTH_MAIL_ENABLED: \"$MANAGEMENT_HEALTH_MAIL_ENABLED\"|g" k8s/configmap.yaml
          sed -i "s|    newName: .*|    newName: $IMAGE_REPOSITORY|g" k8s/kustomization.yaml
          sed -i "s|    newTag: .*|    newTag: $IMAGE_TAG|g" k8s/kustomization.yaml

      - name: Apply Kubernetes manifests
        run: kubectl apply -k k8s

      - name: Update deployment image
        env:
          IMAGE_URI: ${{ steps.terraform-outputs.outputs.ecr_repository_url }}:${{ github.sha }}
        run: kubectl set image deployment/"$K8S_DEPLOYMENT" "$K8S_CONTAINER"="$IMAGE_URI" -n "$K8S_NAMESPACE"

      - name: Wait for rollout
        run: kubectl rollout status deployment/"$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout=180s

      - name: Update public base URL from LoadBalancer
        run: |
          LOAD_BALANCER_HOSTNAME=""

          for attempt in $(seq 1 30); do
            LOAD_BALANCER_HOSTNAME="$(kubectl get svc oficina-api -n "$K8S_NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"

            if [ -n "$LOAD_BALANCER_HOSTNAME" ]; then
              break
            fi

            echo "Waiting for LoadBalancer hostname... attempt $attempt/30"
            sleep 10
          done

          if [ -n "$LOAD_BALANCER_HOSTNAME" ]; then
            kubectl patch configmap oficina-api-config -n "$K8S_NAMESPACE" \
              --type merge \
              -p "{\"data\":{\"OFICINA_PUBLIC_BASE_URL\":\"http://$LOAD_BALANCER_HOSTNAME\"}}"
            kubectl rollout restart deployment/"$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE"
            kubectl rollout status deployment/"$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout=180s
          else
            echo "LoadBalancer hostname is not available yet. Keeping temporary OFICINA_PUBLIC_BASE_URL."
          fi

      - name: Print deployment URL
        run: |
          kubectl get svc oficina-api -n "$K8S_NAMESPACE"
          echo "Swagger: http://$(kubectl get svc oficina-api -n "$K8S_NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')/swagger-ui.html"
